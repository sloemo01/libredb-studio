# Fork-only probe for issue #1726: measure the two runners that fail intermittently.
# Not for upstream; the final PR carries no probe step.
name: R-S10 probe

on:
  push:
    branches: [probe/r-s10]
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Probe the hostile set 20 times
        shell: bash
        run: |
          for i in $(seq 1 20); do
            PROBE_ITER=$i bun tests/helpers/r10-probe.ts >> "probe-${{ matrix.os }}.jsonl" 2>> "probe-${{ matrix.os }}.err" || echo "iter $i exit $?" >> "probe-${{ matrix.os }}.err"
          done

      - name: Report the toolchain
        shell: bash
        run: |
          echo "platform: $(uname -s 2>/dev/null || echo windows) $(uname -m 2>/dev/null || echo unknown)"
          echo "bun:  $(bun --version)"
          echo "node: $(node --version)"
          wc -l "probe-${{ matrix.os }}.jsonl" 2>/dev/null || echo "no probe output"

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-probe-${{ matrix.os }}
          path: |
            probe-${{ matrix.os }}.jsonl
            probe-${{ matrix.os }}.err
          if-no-files-found: ignore
